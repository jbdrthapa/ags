<svg width="64" height="64" viewBox="0 0 64 64"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Card body -->
  <rect x="8" y="14" width="48" height="36" rx="4"
        fill="none" stroke="#40a02b" stroke-width="2"/>

  <!-- PCI connector -->
  <rect x="12" y="50" width="20" height="4" rx="1"
        fill="none" stroke="#40a02b" stroke-width="2"/>

  <!-- Fan housing -->
  <circle cx="36" cy="32" r="10"
          fill="none" stroke="#40a02b" stroke-width="2"/>

  <!-- Fan blades (subtle for suspended state) -->
  <path d="M36 22 L39 27 L36 30 L33 27 Z"
        fill="none" stroke="#40a02b" stroke-width="1.2" opacity="0.8"/>
  <path d="M46 32 L41 35 L38 32 L41 29 Z"
        fill="none" stroke="#40a02b" stroke-width="1.2" opacity="0.8"/>

  <!-- Heat pipes -->
  <path d="M14 20 H28" stroke="#40a02b" stroke-width="1.5" opacity="0.8"/>
  <path d="M14 26 H24" stroke="#40a02b" stroke-width="1.5" opacity="0.7"/>

  <!-- Pause symbol -->
  <rect x="18" y="22" width="4" height="16" rx="1"
        fill="#40a02b"/>
  <rect x="24" y="22" width="4" height="16" rx="1"
        fill="#40a02b"/>

</svg>