<svg width="64" height="64" viewBox="0 0 64 64"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Card body -->
  <rect x="8" y="14" width="48" height="36" rx="4"
        fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- PCI connector -->
  <rect x="12" y="50" width="20" height="4" rx="1"
        fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Fan housing -->
  <circle cx="36" cy="32" r="10"
          fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Fan blades (subtle) -->
  <path d="M36 22 L39 27 L36 30 L33 27 Z"
        fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>

  <!-- Question mark -->
  <path d="M18 24
           C18 20 26 20 26 24
           C26 27 22 28 22 31"
        stroke="#FFFFFF" stroke-width="2" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="22" cy="35" r="2" fill="#FFFFFF"/>

  <!-- Glitch bars -->
  <rect x="14" y="20" width="6" height="2" fill="#FFFFFF" opacity="0.5"/>
  <rect x="20" y="30" width="8" height="2" fill="#FFFFFF" opacity="0.4"/>
  <rect x="16" y="40" width="10" height="2" fill="#FFFFFF" opacity="0.3"/>

</svg>
